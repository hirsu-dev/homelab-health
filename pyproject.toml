[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "homelab-health"
version = "0.1.0"
description = "Lantern: private service checks and honest, gap-aware health history"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]
[tool.setuptools.packages.find]
include = ["lantern*"]
[tool.setuptools.package-data]
lantern = ["web/*"]
